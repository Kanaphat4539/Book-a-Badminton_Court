
services:
  mysql:
    image: mysql:8.0
    container_name: badminton_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: badminton_db
      MYSQL_USER: badminton_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: badminton_backend
    restart: always
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - DB_TYPE=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=badminton_user
      - DB_PASSWORD=password
      - DB_NAME=badminton_db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-}
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:4000
    container_name: badminton_frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4001
      - BACKEND_URL=http://backend:4000
    depends_on:
      - backend

volumes:
  mysql_data:
